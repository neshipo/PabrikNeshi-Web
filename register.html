
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Pabrik Neshi</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;
  justify-content:center;align-items:center;
  padding:20px;font-family:Arial,sans-serif;
  background:radial-gradient(circle at top,#29204d,#080b16 65%);
  color:white;
}
.card{
  width:100%;max-width:430px;padding:35px;
  background:#121728;border:1px solid #34304e;
  border-radius:18px;box-shadow:0 20px 60px #0008;
}
.logo{text-align:center;font-size:23px;font-weight:bold}
.logo span{color:#9b7bff}
.tag{text-align:center;color:#49d5e8;letter-spacing:3px;font-size:10px;margin-top:10px}
h1{text-align:center;font-size:27px;margin-top:28px}
.desc{text-align:center;color:#a5aec3;font-size:13px;line-height:1.6}
label{display:block;margin:18px 0 9px;font-size:13px}
input{
  width:100%;padding:14px;background:#080b16;
  border:1px solid #343c58;border-radius:9px;
  color:white;outline:none;
}
input:focus{border-color:#9b7bff}
button{
  width:100%;margin-top:25px;padding:15px;
  border:0;border-radius:9px;background:#9b7bff;
  color:white;font-weight:bold;font-size:14px;
}
.login{text-align:center;color:#a5aec3;font-size:13px;margin-top:24px}
a{color:#49d5e8;text-decoration:none}
.home{display:block;text-align:center;margin-top:20px;color:#a5aec3;font-size:12px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">PABRIK <span>NESHI</span></div>
  <div class="tag">CUSTOMER REGISTRATION</div>

  <h1>Buat Akun</h1>
  <p class="desc">Daftar untuk mulai menggunakan layanan Pabrik Neshi.</p>

  <form onsubmit="event.preventDefault();alert('Pendaftaran belum aktif. Sistem database akan dihubungkan pada tahap berikutnya.');">
    <label>Nama / Nickname</label>
    <input type="text" placeholder="Nama kamu" required>

    <label>Email</label>
    <input type="email" placeholder="nama@email.com" required>

    <label>Password</label>
    <input type="password" placeholder="Minimal 8 karakter" minlength="8" required>

    <label>Konfirmasi Password</label>
    <input type="password" placeholder="Ulangi password" minlength="8" required>

    <button type="submit">DAFTAR SEKARANG</button>
  </form>

  <p class="login">Sudah punya akun? <a href="login.html">Login</a></p>
  <a class="home" href="index.html">← Kembali ke Home</a>
</div>
</body>
</html>
