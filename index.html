
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Pabrik Neshi</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 padding:20px;font-family:Arial,sans-serif;color:white;
 background:radial-gradient(circle at top,#29204d,#080b16 65%);
}
.card{
 width:100%;max-width:420px;padding:32px;
 background:#121728;border:1px solid #34304e;
 border-radius:18px;
}
.logo{text-align:center;font-size:23px;font-weight:bold}
.logo span{color:#9b7bff}
.tag{text-align:center;color:#49d5e8;letter-spacing:3px;font-size:10px;margin-top:10px}
h1{text-align:center;margin-top:30px}
.desc{text-align:center;color:#a5aec3;font-size:13px;line-height:1.6}
label{display:block;margin:20px 0 8px;font-size:13px}
input{
 width:100%;padding:14px;background:#080b16;
 border:1px solid #343c58;border-radius:9px;color:white;
}
button{
 width:100%;padding:14px;margin-top:18px;border:0;
 border-radius:9px;background:#9b7bff;color:white;
 font-weight:bold;cursor:pointer;
}
.google{background:#202940;border:1px solid #46516c}
a{color:#49d5e8;text-decoration:none;font-size:13px}
.forgot{text-align:right;margin-top:12px}
.message{font-size:12px;color:#49d5e8;line-height:1.5}
.bottom{text-align:center;color:#a5aec3;font-size:13px;margin-top:22px}
.home{text-align:center;margin-top:20px}
</style>
</head>
<body>
<div class="card">
 <div class="logo">PABRIK <span>NESHI</span></div>
 <div class="tag">GAME SERVICE</div>

 <h1>Selamat Datang</h1>
 <p class="desc">Login untuk mengakses pesanan dan layanan Pabrik Neshi.</p>

 <form id="loginForm">
  <label>Email</label>
  <input id="email" type="email" placeholder="nama@email.com" required>

  <label>Password</label>
  <input id="password" type="password" placeholder="Password" required>

  <div class="forgot"><a href="forgot-password.html">Lupa password?</a></div>
  <button type="submit">LOGIN</button>
 </form>

 <button class="google" id="googleLogin">LOGIN DENGAN GOOGLE</button>
 <p id="message" class="message"></p>

 <div class="bottom">
  Belum punya akun? <a href="register.html">Daftar</a>
 </div>
 <div class="home"><a href="index.html">← Kembali ke Home</a></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
const message = document.getElementById("message");

document.getElementById("loginForm").addEventListener("submit", async function(e){
 e.preventDefault();
 message.textContent = "Sedang login...";

 try {
  const result = await auth.signInWithEmailAndPassword(
   document.getElementById("email").value.trim(),
   document.getElementById("password").value
  );
  openDashboard(result.user);
 } catch(error) {
  message.textContent = "Login gagal: " + error.message;
 }
});

document.getElementById("googleLogin").addEventListener("click", async function(){
 message.textContent = "Menghubungkan ke Google...";
 try {
  const provider = new firebase.auth.GoogleAuthProvider();
  const result = await auth.signInWithPopup(provider);
  openDashboard(result.user);
 } catch(error) {
  message.textContent = "Login Google gagal: " + error.message;
 }
});

function openDashboard(user){
 if(user.uid === "I7DZ2W2pBCZlkKbI9kDH60m3Rh53"){
  window.location.href = "admin-dashboard.html";
 } else {
  window.location.href = "customer-dashboard.html";
 }
}
</script>
</body>
</html>
