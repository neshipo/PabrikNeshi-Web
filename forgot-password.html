
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lupa Password - Pabrik Neshi</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;
  justify-content:center;align-items:center;padding:20px;
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at top,#29204d,#080b16 65%);
  color:white;
}
.card{
  width:100%;max-width:420px;padding:35px;
  background:#121728;border:1px solid #34304e;
  border-radius:18px;box-shadow:0 20px 60px #0008;
}
.logo{text-align:center;font-size:23px;font-weight:bold}
.logo span{color:#9b7bff}
.tag{text-align:center;color:#49d5e8;letter-spacing:3px;font-size:10px;margin-top:10px}
h1{text-align:center;font-size:26px;margin-top:30px}
p{text-align:center;color:#a5aec3;font-size:13px;line-height:1.7}
label{display:block;margin:25px 0 9px;font-size:13px}
input{
  width:100%;padding:14px;background:#080b16;
  border:1px solid #343c58;border-radius:9px;
  color:white;outline:none;
}
input:focus{border-color:#9b7bff}
button{
  width:100%;margin-top:23px;padding:15px;
  border:0;border-radius:9px;background:#9b7bff;
  color:white;font-weight:bold;font-size:14px;
}
a{color:#49d5e8;text-decoration:none}
.back{text-align:center;margin-top:25px;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">PABRIK <span>NESHI</span></div>
  <div class="tag">ACCOUNT RECOVERY</div>

  <h1>Lupa Password?</h1>
  <p>Masukkan alamat email yang terhubung dengan akun Pabrik Neshi. Petunjuk reset password akan dikirim melalui email setelah sistem diaktifkan.</p>

  <form onsubmit="event.preventDefault();alert('Fitur reset password belum aktif. Akan dihubungkan setelah backend siap.');">
    <label>Alamat Email</label>
    <input type="email" placeholder="nama@email.com" required>
    <button type="submit">KIRIM PETUNJUK RESET</button>
  </form>

  <div class="back"><a href="login.html">← Kembali ke Login</a></div>
</div>
</body>
</html>
